name: Deploy Lyrictify to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "firebase-hosting-jhs-lyrictify"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and run unit tests
        run: npm run lint && npm test

      - name: Build static site with Vite
        run: npm run build

      - name: Deploy to Firebase Hosting (jhs-lyrictify)
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GITHUB_JHS }}
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$FIREBASE_SA_KEY" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          curl -fsSL https://firebase.tools/bin/linux/latest -o "$RUNNER_TEMP/firebase"
          chmod +x "$RUNNER_TEMP/firebase"
          "$RUNNER_TEMP/firebase" deploy --only hosting --project github-jhs --non-interactive
